services:
    # HTTP container
    autoenv-default:
        environment:
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            PORT: 80
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80

    autoenv-port-test:
        environment:
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            PORT: 8080
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 8080

    autoenv-custom:
        environment:
            AUTOENV_HTTP_PATH: /__myvars
            AUTOENV_PREFIX: MYVAR_
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            MYVAR_1: my_value_1
            MYVAR_2: my_value_2
            PORT: 80
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80

    # HTML injection test containers
    autoenv-html-default:
        environment:
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            PORT: 80
            AUTOENV_INJECT_HTML: true
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80
        volumes:
            - ${HTML_TEMPLATES_DIR:-./html_templates}/index.html:/app/index.html

    autoenv-html-custom:
        environment:
            AUTOENV_PREFIX: MYVAR_
            AUTOENV_GLOBAL_VAR: window.myCustomConfig
            MYVAR_1: my_value_1
            MYVAR_2: my_value_2
            PORT: 80
            AUTOENV_INJECT_HTML: true
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80
        volumes:
            - ${HTML_TEMPLATES_DIR:-./html_templates}/custom.html:/app/index.html

    autoenv-html-disabled:
        environment:
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            PORT: 80
            AUTOENV_INJECT_HTML: false
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80
        volumes:
            - ${HTML_TEMPLATES_DIR:-./html_templates}/disabled.html:/app/index.html

    # Test that all .html files are processed, not just index.html
    autoenv-html-multi:
        environment:
            APP_VAR_1: value_1
            APP_VAR_2: value_2
            PORT: 80
            AUTOENV_INJECT_HTML: true
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80
        volumes:
            - ${HTML_TEMPLATES_DIR:-./html_templates}/multi-index.html:/app/index.html
            - ${HTML_TEMPLATES_DIR:-./html_templates}/about.html:/app/about.html

    # Values containing markup must not break out of the injected script tag
    autoenv-html-escape:
        environment:
            APP_VAR_1: '</script><script>alert(1)</script>$&'
            PORT: 80
            AUTOENV_INJECT_HTML: true
        image: ${AUTOENV_IMAGE}
        networks:
            - default
        expose:
            - 80
        volumes:
            - ${HTML_TEMPLATES_DIR:-./html_templates}/escape.html:/app/index.html

    test_runner:
        image: alpine
        depends_on:
            - autoenv-default
            - autoenv-port-test
            - autoenv-custom
            - autoenv-html-default
            - autoenv-html-custom
            - autoenv-html-disabled
            - autoenv-html-multi
            - autoenv-html-escape
        networks:
            - default
        volumes:
            - .:/work
        working_dir: /work
        command: /work/test.sh
